; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` tanpa -e hanya build firmware ESP32 (env native khusus unit test)
default_envs = esp32doit-devkit-v1

; Versi platform DIKUNCI di 6.5.0 (Arduino core 2.0.14): library composite
; video fase berikutnya tidak kompatibel dengan core 3.x. Jangan dinaikkan.
[env:esp32doit-devkit-v1]
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps = adafruit/Adafruit MAX31865 library@^1.6.0


[env:native]
platform       = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -I test/support
    -D USE_CURVE_FIT=1        ; lihat catatan di test/README.md
    -D UNIT_TEST

