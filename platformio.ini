; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Env:
;   esp32doit-devkit-v1  firmware alat (LCD composite + rotary + sensor + WiFi + lampu)
;   simulasi             firmware yang sama, tetapi sensor & lampu DITIRU (lampu asli
;                        tidak pernah menyala). Untuk mencoba semua layar tes dengan aman.
;   ota                  firmware alat, di-upload lewat WiFi (bukan USB)
;   native               unit test di PC (lib/HeatboxCycle, lib/HeatboxInput)
; Env tes hardware lama (lcd_test, rotary_test) ada di archive/tes_hardware/.

[platformio]
; `pio run` tanpa -e hanya build firmware ESP32 (env native khusus unit test)
default_envs = esp32doit-devkit-v1

; Versi platform DIKUNCI di 6.5.0 (Arduino core 2.0.14): library composite
; video tidak kompatibel dengan core 3.x. Jangan dinaikkan.
[env:esp32doit-devkit-v1]
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
; VIDEO_PAL  : 0 = NTSC (bawaan, sudah terbukti tampil), 1 = PAL
; ENABLE_WIFI: 1 = WiFi STA + NTP aktif, 0 = WiFi tidak di-link sama sekali
;              (untuk membandingkan noise ADS dan kestabilan video)
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DVIDEO_PAL=0
    -DENABLE_WIFI=1
    -Iinclude
; Versi library video dikunci ke versi yang dipakai tes LCD 28 Okt 2026.
; Adafruit BusIO juga dipakai Adafruit MAX31865; 1.17.4 sama dengan versi
; yang sudah ter-resolve sebelumnya, jadi perilaku RtdSensor tidak berubah.
lib_deps =
    adafruit/Adafruit MAX31865 library@^1.6.0
    roger-random/ESP_8_BIT Color Composite Video Library@1.3.2
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4

; Simulasi: semua dari env alat + HB_SIMULASI. Waktu siklus dipercepat
; HB_SIM_SPEED kali (pre-heat 10 mnt = 1 mnt). Pintu tetap dari limit switch
; asli: buka lalu tutup di layar MUAT SAMPEL = sampel 5 g "dimasukkan".
;   pio run -e simulasi -t upload
[env:simulasi]
extends = env:esp32doit-devkit-v1
build_flags =
    ${env:esp32doit-devkit-v1.build_flags}
    -DHB_SIMULASI=1
    -DHB_SIM_SPEED=10

; Upload lewat WiFi (OTA). Syarat: OTA_PASS di include/secrets.h sudah
; terpasang di alat (upload USB sekali), PC & alat di jaringan yang sama.
; Nama alat ada di LCD: PENGATURAN > INFO PERANGKAT > NAMA OTA.
;   set HEATBOX_OTA_PASS=<sandi>            (PowerShell: $env:HEATBOX_OTA_PASS="<sandi>")
;   pio run -e ota -t upload --upload-port heatbox-xxxxxx.local
; Kalau .local tidak ketemu, pakai ALAMAT IP dari layar yang sama.
[env:ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_flags =
    --auth=${sysenv.HEATBOX_OTA_PASS}

[env:native]
platform       = native
test_framework = unity
build_flags =
    -std=gnu++17
    -D UNIT_TEST
